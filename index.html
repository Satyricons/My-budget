<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой бюджет</title>
    <link rel="stylesheet" href="style.css">
    <!-- Модули грузятся отложенно, defer не нужен, type="module" делает это сам -->
    <script src="api.js" type="module"></script>
    <script src="main.js" type="module"></script>
</head>
<body>
    <!-- Шапка сайта -->
    <header class="header">
        <div class="header-content">
            <div class="logo">💰 Семейный бюджет</div>
            <div class="exchange-rates">Курс: $ .. | РР: ..</div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="container">
        <div class="budget">Загрузка...</div>

        <div class="actions">
            <button id="incomeBtn" class="btn btn-income">➕ Пополнить</button>
            <button id="withdrawBtn" class="btn btn-withdraw">➖ Снять</button>
        </div>

        <!-- Модальное окно -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modalTitle">Пополнить</h2>
                <label for="amountInput">Сумма ($):</label>
                <input type="number" id="amountInput" placeholder="0.00" step="0.01" min="0">
                <div class="modal-buttons">
                    <button id="cancelBtn" class="btn btn-cancel">Отмена</button>
                    <button id="confirmBtn" class="btn btn-confirm">Подтвердить</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Подвал сайта (навигация) -->
    <footer class="footer">
        <nav class="footer-nav">
            <a href="#" class="active">Главная</a>
            <a href="#">Платежи</a>
            <a href="#">Журнал</a>
            <a href="#">Финансы</a>
        </nav>
    </footer>
</body>
</html>
